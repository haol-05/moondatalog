name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: moonbitlang/core/.github/actions/setup@main

      - name: Check
        run: moon check

      - name: Test
        run: moon test

      - name: Build (all targets)
        run: moon build --target all
